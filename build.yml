name: Construire Focus Terminale

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extraire le projet
        run: |
          if [ -f FocusTerminale-prototype-android.zip ]; then
            unzip -o FocusTerminale-prototype-android.zip -d .
          else
            echo "Fichier zip introuvable ou déjà extrait"
          fi

      - name: Accorder les permissions d'exécution à Gradle Wrapper (si présent)
        run: |
          if [ -f FocusTerminale/gradlew ]; then
            chmod +x FocusTerminale/gradlew
          fi

      - name: Compiler l'application (APK Debug)
        run: |
          cd FocusTerminale
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Sauvegarder le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Terminale-APK
          path: FocusTerminale/app/build/outputs/apk/debug/*.apk
