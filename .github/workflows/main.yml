
name: Construire Focus Terminale APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: unzip -o FocusTerminale-prototype-android.zip -d .

      - name: Compiler l'application
        run: gradle -p FocusTerminale :app:assembleDebug

      - name: Recuperer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Terminale-APK
          path: FocusTerminale/app/build/outputs/apk/debug/*.apk
