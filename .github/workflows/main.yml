name: Construire Focus Terminale

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer et configurer l'Android SDK manuellement
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp_tools
          mv temp_tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accepter les licences et installer les composants SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extraire le projet (si compressé)
        run: |
          if [ -f FocusTerminale-prototype-android.zip ]; then
            unzip -o FocusTerminale-prototype-android.zip -d .
          fi
          # Afficher la structure des fichiers pour le diagnostic
          echo "Contenu du répertoire :"
          ls -R

      - name: Trouver gradlew et compiler l'APK
        run: |
          # Chercher où se trouve le fichier gradlew dans le dépôt
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Erreur : gradlew introuvable !"
            exit 1
          fi
          
          # Récupérer le dossier parent où se trouve gradlew
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Projet trouvé dans : $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Sauvegarder le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Terminale-APK
          path: '**/build/outputs/apk/debug/*.apk'
